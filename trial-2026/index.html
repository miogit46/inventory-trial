<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,interactive-widget=resizes-visual">
<meta name="theme-color" content="#17345f">
<meta name="description" content="Aplikasi katalog dan stok toko alat musik.">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Toko Alat Musik - Trial</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#f4f6f9;color:#222;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
.screen{display:none;min-height:100vh;flex-direction:column}
.screen.active{display:flex}
.btn{width:100%;padding:13px;border-radius:10px;border:none;font-size:15px;font-weight:600;cursor:pointer;background:#ffd166;color:#1e3c72;transition:.2s}
.btn:active{transform:scale(.98)}
.btn-sec{background:#2a5298;color:#fff}
.btn-danger{background:#e63946;color:#fff}
.btn-sm{padding:8px 12px;font-size:12px;width:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;margin-bottom:5px;color:#555;font-weight:600}
.field input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #ddd;font-size:15px;background:#fff;outline:none;font-family:inherit}
.field input:focus{border-color:#2a5298}
.app-header{background:linear-gradient(135deg,#1e3c72,#2a5298);color:#fff;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px rgba(0,0,0,.15);min-height:54px}
.app-header h1{font-size:15px;display:flex;align-items:center;gap:8px}
.app-header .back-btn{background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:0;line-height:1}
.app-header .right-btns{display:flex;gap:6px;align-items:center}
.app-header .icon-btn{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.app-header .user-badge{background:rgba(255,255,255,.15);padding:5px 11px;border-radius:20px;font-size:11px;display:flex;align-items:center;gap:5px;font-weight:600}
#screen-home .content{padding:15px;flex:1;overflow-y:auto;padding-bottom:30px}
.group-title{font-size:11px;font-weight:700;letter-spacing:1px;color:#888;margin:20px 0 9px 4px;text-transform:uppercase}
.group-title:first-child{margin-top:0}
.menu-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu-card{background:#fff;border-radius:12px;padding:15px 11px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;transition:.2s;border:2px solid transparent}
.menu-card:active{transform:scale(.96);border-color:#2a5298}
.menu-card .icon{font-size:28px}
.menu-card .label{font-size:12px;font-weight:600;color:#1e3c72;text-align:center;line-height:1.2}
.menu-card .count{font-size:10px;background:#e0e7ff;color:#2a5298;padding:2px 7px;border-radius:9px;font-weight:600}
#screen-produk .content{flex:1;overflow-y:auto;padding:11px;padding-bottom:90px}
#screen-produk{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#screen-produk>.app-header{flex:0 0 auto;position:sticky;top:0}
#screen-produk>.content{flex:1 1 0%;min-height:0;overscroll-behavior:contain}
.grid-produk{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kartu-produk{background:#fff;border-radius:11px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer;transition:.2s;display:flex;flex-direction:column;position:relative}
.kartu-produk:active{transform:scale(.97)}
.kartu-produk .body{padding:9px;flex:1;display:flex;flex-direction:column;gap:3px}
.kartu-produk .nama-rapat{font-size:14px;font-weight:700;color:#000;line-height:1.3;overflow:hidden}
.kartu-produk .warna{font-size:13px;font-weight:700;color:#2a5298}
.kartu-produk .harga-list{font-size:13px;font-weight:700;color:#2a5298}
.kartu-produk .harga-list .diskon{font-size:13px;color:#ED0004;font-weight:400}
.kartu-produk .harga-diskon{font-size:13px;color:#06a77d}
.kartu-produk .stok-ket{font-size:12px;color:#000;background:#f0f0f0;padding:3px 6px;border-radius:6px;margin-top:3px}
.kartu-produk .edit-inline{width:70px;padding:2px 4px;border:1px solid #2a5298;border-radius:4px;font-size:12px;font-weight:700;color:#2a5298;background:#fff;text-align:center}
.kartu-produk .chk-pilih{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid #2a5298;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;z-index:5}
.kartu-produk.terpilih .chk-pilih{background:#2a5298}
.kartu-produk.terpilih{outline:3px solid #2a5298}
.search-bar-fixed{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:11px;display:flex;gap:8px;box-shadow:0 -3px 12px rgba(0,0,0,.08);z-index:15;border-top:1px solid #eee;transform:translateY(calc(-1 * var(--keyboard-offset,0px)))}
.search-bar-fixed input{display:block;flex:1 1 auto;width:100%;min-width:0;height:48px;padding:0 13px;border-radius:10px;border:1px solid #ddd;font-size:16px;outline:none;touch-action:manipulation}
.search-bar-fixed input:focus{border-color:#2a5298}
.search-bar-fixed .filter-btn{background:#2a5298;color:#fff;border:none;padding:11px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer}
#screen-detail .content{flex:1;overflow-y:auto;padding-bottom:30px}
#screen-detail-kelompok .content{flex:1;overflow-y:auto;padding:14px}
#screen-detail-kelompok .detail-section{min-height:calc(100vh - 82px);margin:0;border-radius:0}
.detail-body{padding:14px}
.detail-body h2{font-size:17px;color:#1e3c72;margin-bottom:6px}
.badge{display:inline-block;background:#e0e7ff;color:#2a5298;padding:3px 9px;border-radius:7px;font-size:10px;font-weight:600;margin-right:5px;margin-bottom:9px}
.detail-section{background:#fff;border-radius:11px;padding:13px;margin-bottom:11px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
#screen-detail .detail-section[data-kelompok]{height:auto;overflow:visible}
#screen-detail .detail-section[data-kelompok="deskripsi"],#screen-detail .detail-section[data-kelompok="keterangan"]{height:154px;overflow:hidden}
#screen-detail .detail-row .value{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#screen-detail [data-kelompok="info"] .detail-row{padding:6px 0}
#screen-detail [data-edit-field="deskripsi"],#screen-detail [data-edit-field="keterangan"]{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5;line-clamp:5;overflow:hidden;overflow-wrap:anywhere}
.detail-section .title{font-size:11px;color:#2a5298;font-weight:700;letter-spacing:.5px;margin-bottom:9px;border-bottom:1px dashed #eee;padding-bottom:6px}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;font-size:13px;border-bottom:1px dashed #f0f0f0;gap:10px}
.detail-row:last-child{border-bottom:none}
.detail-row .label{color:#666;flex-shrink:0}
.detail-row .value{font-weight:600;color:#222;text-align:right;word-break:break-word}
.detail-row .detail-editable{cursor:pointer;text-decoration:underline dotted;text-underline-offset:3px}
.detail-price-section .detail-row .value{font-size:21px}
.detail-price-section .diskon-value{display:inline-flex;justify-content:flex-end;align-items:baseline;gap:8px;flex-wrap:wrap}
.detail-price-section .diskon-amount{white-space:nowrap;font-size:19px}
.detail-price-section .detail-row .value.harga-diskon{color:#ED0004}
.detail-section .edit-inline{width:150px;max-width:60%;padding:5px 7px;border:1px solid #2a5298;border-radius:5px;font-size:13px;font-weight:600;color:#222;background:#fff;text-align:right}
.detail-section textarea.edit-inline{width:100%;max-width:100%;min-height:110px;resize:vertical;text-align:left}
.field-editor{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px;max-width:100%}
.field-editor[data-multiline="true"]{width:100%;justify-content:stretch}
.field-editor textarea.edit-inline{width:100%}
.field-editor-actions{display:flex;gap:5px}
.field-editor-actions .btn{width:auto;padding:6px 9px;font-size:12px}
.harga-diskon{font-size:17px;font-weight:700;color:#2a5298}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:100;padding:18px}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:13px;padding:18px;width:100%;max-width:420px;max-height:88vh;overflow-y:auto}
.modal-overlay.filter-keyboard-open{top:var(--visual-viewport-top,0px);right:0;bottom:auto;left:0;height:var(--visual-viewport-height,100dvh);padding:10px;overflow-y:auto}
.modal-overlay.filter-keyboard-open .modal{max-height:calc(var(--visual-viewport-height,100dvh) - 20px);margin:auto}
.modal h3{font-size:15px;margin-bottom:12px;color:#1e3c72}
.modal p{font-size:13px;color:#555;margin-bottom:12px;line-height:1.5}
.modal .btn-row{display:flex;gap:9px;margin-top:8px}
.modal .btn-row .btn{padding:11px}
.modal .pilihan-aksi{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.modal .pilihan-aksi .btn{padding:13px;font-size:14px;text-align:left;display:flex;align-items:center;gap:10px}
.modal .pilihan-aksi .btn .ico{font-size:18px}
.chip-cat{display:inline-block;padding:7px 14px;border-radius:20px;border:1px solid #ddd;background:#fff;color:#333;font-size:12px;margin:4px;cursor:pointer}
.chip-cat.active{background:#2a5298;color:#fff;border-color:#2a5298}
.tombol-hapus-terpilih{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#e63946;color:#fff;border:none;padding:13px 24px;border-radius:30px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 4px 12px rgba(230,57,70,.4);z-index:20;display:none}
.tombol-hapus-terpilih.show{display:block}
.pin-input{font-size:24px !important;text-align:center;letter-spacing:12px;padding:15px !important}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(80px);background:#222;color:#fff;padding:11px 20px;border-radius:9px;font-size:12px;opacity:0;transition:.3s;z-index:300;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.error{background:#e63946}
.toast.success{background:#06a77d}
.empty{text-align:center;color:#999;padding:50px 20px;font-size:13px}
#screen-coming .content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
#screen-coming .big-icon{font-size:70px;margin-bottom:16px;opacity:.3}
#screen-coming h2{font-size:18px;margin-bottom:8px;color:#1e3c72}
#screen-coming p{font-size:13px;color:#888;margin-bottom:24px}

:root{
  --brand-deep:#17345f;
  --brand:#28569a;
  --brand-soft:#eaf0fb;
  --ink:#172033;
  --muted:#687386;
  --surface:#fff;
  --canvas:#f3f5f9;
  --line:#e6eaf1;
  --shadow-card:0 8px 24px rgba(25,43,76,.07);
  --radius-card:16px;
}
body{background:var(--canvas);color:var(--ink)}
.screen{background:var(--canvas)}
.app-header{
  background:linear-gradient(120deg,var(--brand-deep),var(--brand));
  padding:14px 17px;
  box-shadow:0 5px 18px rgba(23,52,95,.18);
}
.app-header h1{font-size:16px;font-weight:700;letter-spacing:.1px}
.app-header .back-btn{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.12)}
.app-header .right-btns{gap:8px}
.app-header .icon-btn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);transition:background .18s ease,transform .18s ease}
.app-header .icon-btn:active{background:rgba(255,255,255,.25);transform:scale(.96)}
.app-header .user-badge{background:rgba(255,255,255,.12);padding:7px 12px;border:1px solid rgba(255,255,255,.12)}
#screen-home .content{padding:20px 16px 32px}
.group-title{margin:8px 0 13px 2px;color:#788398;font-size:11px;letter-spacing:1.15px}
.menu-grid{gap:13px}
.menu-card{
  min-height:146px;
  padding:19px 14px;
  border:1px solid rgba(224,230,240,.9);
  border-radius:var(--radius-card);
  box-shadow:var(--shadow-card);
  gap:9px;
}
.menu-card:active{transform:scale(.985);border-color:#b7c8e6}
.menu-card .icon{width:54px;height:54px;display:grid;place-items:center;border-radius:17px;background:var(--brand-soft);font-size:27px}
.menu-card .icon svg{width:38px;height:38px;display:block}
.menu-card .label{font-size:13px;color:var(--brand-deep)}
.menu-card .count{padding:4px 10px;border-radius:99px;background:#f1f4fa;color:#5d6b82;font-size:11px}
#screen-produk .content{padding:14px 12px 100px}
.grid-produk{gap:12px}
.kartu-produk{
  border:1px solid #e9edf4;
  border-radius:var(--radius-card);
  box-shadow:0 4px 14px rgba(25,43,76,.065);
  transition:transform .18s ease,box-shadow .18s ease;
}
.kartu-produk:active{transform:scale(.985);box-shadow:0 2px 8px rgba(25,43,76,.1)}
.kartu-produk .body{padding:11px 10px 12px;gap:5px}
.kartu-produk .nama-rapat{font-size:13px;line-height:1.35;color:var(--ink)}
.kartu-produk .kategori-produk{font-size:13px;font-weight:700;color:var(--ink);line-height:1.35}
.kartu-produk .model-produk{margin-top:-4px}
.kartu-produk .warna{font-size:12px;color:#63718a}
.kartu-produk .harga-list{font-size:14px;color:var(--brand)}
.kartu-produk .harga-list .diskon{font-weight:600}
.kartu-produk .harga-diskon{font-size:13px;font-weight:700;color:#c8323e}
.kartu-produk .stok-ket,.kartu-produk .keterangan-ket{background:#f4f6fa;color:#677286;border-radius:7px;font-size:10px;padding:5px 7px;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere}
.kartu-produk.terpilih{outline:2px solid var(--brand);outline-offset:1px}
.kartu-produk .chk-pilih{box-shadow:0 2px 8px rgba(23,52,95,.2)}
.search-bar-fixed{
  padding:12px;
  gap:9px;
  background:rgba(255,255,255,.96);
  border-top:1px solid rgba(222,228,238,.9);
  box-shadow:0 -7px 22px rgba(25,43,76,.08);
}
.search-bar-fixed input{
  height:47px;
  padding:0 15px;
  border:1px solid #dfe4ed;
  border-radius:13px;
  background:#f9fafc;
  color:var(--ink);
}
.search-bar-fixed input:focus{border-color:#8ea8d2;background:#fff;box-shadow:0 0 0 3px rgba(40,86,154,.1)}
.search-bar-fixed .filter-btn{padding:0 16px;border-radius:13px;background:var(--brand);box-shadow:0 3px 8px rgba(40,86,154,.18)}
#screen-detail .content{padding-bottom:28px}
.detail-body{padding:18px 16px}
.detail-body h2{font-size:20px;line-height:1.3;color:var(--brand-deep);margin-bottom:9px}
.badge{padding:5px 11px;border:1px solid #dfe7f5;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-size:10px}
.detail-section{
  padding:15px;
  border:1px solid #e9edf4;
  border-radius:var(--radius-card);
  box-shadow:0 5px 16px rgba(25,43,76,.055);
}
.detail-section .title{font-size:14px;letter-spacing:.7px;color:var(--brand);border-bottom-color:#edf0f5}
.detail-row{border-bottom-color:#edf0f5}
.detail-row .label{color:#788398}
.detail-row .value{color:var(--ink)}
.detail-row .detail-editable{ text-decoration-color:#91a5c5}
.detail-price-section .detail-row .value{font-size:18px}
.detail-price-section .diskon-amount{font-size:16px}
.detail-price-section .diskon-value{gap:24px}
.detail-body > div > .badge:first-child{padding:7px 13px;font-size:15px}
.detail-price-section .detail-row .value.harga-diskon{color:#c8323e}
#screen-detail-kelompok .content{padding:16px}
#screen-detail-kelompok .detail-section{border-radius:var(--radius-card);min-height:calc(100vh - 86px)}
.field label{color:#536078;font-size:12px}
.field input{border-color:#dfe4ed;border-radius:11px;padding:12px 13px}
.field input:focus{border-color:#8ea8d2;box-shadow:0 0 0 3px rgba(40,86,154,.1)}
.btn{border-radius:12px;font-weight:700}
.btn-sec{background:var(--brand);color:#fff}
.btn-danger{background:#c8323e;color:#fff}
.modal-overlay{background:rgba(12,24,44,.52);backdrop-filter:blur(3px)}
.modal{border:1px solid rgba(255,255,255,.7);border-radius:18px;padding:20px;box-shadow:0 18px 55px rgba(12,24,44,.24)}
.modal h3{color:var(--brand-deep)}
.chip-cat{border-color:#e0e6ef;color:#536078;border-radius:99px;padding:8px 15px;transition:background .16s ease,border-color .16s ease}
.chip-cat.active{background:var(--brand);border-color:var(--brand);color:#fff}
.tombol-hapus-terpilih{background:#c8323e;box-shadow:0 6px 16px rgba(200,50,62,.28)}
.toast{border-radius:12px;box-shadow:0 8px 24px rgba(15,25,45,.2)}
.toast.error{background:#c8323e}
.toast.success{background:#18856b}
.empty{color:#788398}
#screen-coming h2{color:var(--brand-deep)}
button,input,textarea{transition:box-shadow .18s ease,border-color .18s ease,background-color .18s ease}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid rgba(40,86,154,.25);outline-offset:2px}
.settings-content,.setup-content{width:min(100%,760px);margin:0 auto;padding:18px 16px 32px;overflow-y:auto;flex:1}
.settings-card,.setup-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-card);padding:16px;margin-bottom:14px;box-shadow:var(--shadow-card)}
.settings-card h2,.setup-card h2{font-size:16px;color:var(--brand-deep);margin-bottom:12px}
.settings-card p,.setup-card p{font-size:13px;line-height:1.55;color:var(--muted);margin-bottom:12px}
.settings-card .field:last-child{margin-bottom:0}
.settings-card .setting-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}
.settings-card .setting-row:last-child{border-bottom:0}
.settings-card .setting-row strong{display:block;font-size:13px;color:var(--ink)}
.settings-card .setting-row small{display:block;color:var(--muted);font-size:11px;margin-top:3px}
.settings-card .setting-row button{flex:0 0 auto}
.settings-card input[type="checkbox"]{width:22px;height:22px;accent-color:var(--brand)}
.setup-pin-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.setup-note{padding:11px 13px;border-radius:11px;background:var(--brand-soft);font-size:12px;line-height:1.5;color:var(--brand-deep);margin-bottom:14px}
.setup-error{color:#c8323e;font-size:12px;min-height:18px;margin:0 0 10px}
.settings-btn{font-size:19px!important}
body.dark-theme{--ink:#e9edf5;--muted:#a9b3c4;--surface:#202b3c;--canvas:#111a28;--line:#344155;--brand-soft:#293c59;--brand-deep:#d8e5fb;--shadow-card:0 8px 24px rgba(0,0,0,.24)}
body.dark-theme .menu-card,body.dark-theme .kartu-produk,body.dark-theme .detail-section,body.dark-theme .settings-card,body.dark-theme .setup-card{background:var(--surface);border-color:var(--line)}
body.dark-theme .menu-card .label,body.dark-theme .detail-body h2,body.dark-theme .detail-row .value,body.dark-theme .settings-card .setting-row strong,body.dark-theme .settings-card h2,body.dark-theme .setup-card h2{color:var(--ink)}
body.dark-theme .detail-row .label,body.dark-theme .kartu-produk .warna,body.dark-theme .kartu-produk .stok-ket,body.dark-theme .kartu-produk .keterangan-ket{color:var(--muted)}
body.dark-theme .field input,body.dark-theme .search-bar-fixed,body.dark-theme .search-bar-fixed input{background:#192334;color:var(--ink);border-color:var(--line)}
body.dark-theme .detail-row,body.dark-theme .detail-section .title{border-color:var(--line)}
body.dark-theme .setup-note{color:#d8e5fb}
@media (min-width:700px){
  #screen-home .content,#screen-produk .content,#screen-detail .content,#screen-detail-kelompok .content,#screen-form-produk .content,#screen-settings .content,#screen-setup .content{width:min(100%,760px);margin-inline:auto}
  .grid-produk{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){.setup-pin-grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
}

function muatProdukTersimpan(){
  try {
    if (localStorage.getItem(KUNCI_VERSI_DATA_PRODUK) !== VERSI_DATA_PRODUK) {
      localStorage.setItem(KUNCI_PENYIMPANAN_PRODUK, JSON.stringify(PRODUK));
      localStorage.setItem(KUNCI_VERSI_DATA_PRODUK, VERSI_DATA_PRODUK);
      return;
    }
    const dataTersimpan = localStorage.getItem(KUNCI_PENYIMPANAN_PRODUK);
    if (dataTersimpan === null) return;
    const produkTersimpan = JSON.parse(dataTersimpan);
    if (!Array.isArray(produkTersimpan)) {
      throw new Error("Format data produk tidak valid");

    PRODUK = produkTersimpan;
  } catch (error) {
    showToast("Data produk tersimpan tidak dapat dibaca", "error");
    console.error("Gagal memuat data produk:", error);
  }
}

function parseAngka(t, desimalTitik = false){
  if (typeof t === "number") return t;
  let s = String(t ?? "").trim().replace(/rp\.?/ig, "").replace(/%/g, "").replace(/\s/g, "");
  if (s === "" || !/^-?[\d.,]+$/.test(s)) return NaN;
  if (desimalTitik) s = s.replace(/,/g, ".");
  else if (/^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s = s.replace(/\./g, "").replace(",", ".");
  else if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s = s.replace(/,/g, "");
  else s = s.replace(",", ".");
  const n = Number(s);
  return Number.isFinite(n) ? n : NaN;
}

/* =====================================================
   CSV
   ===================================================== */
function buatTeksCsv(baris){
  const pemisah = ";";
  const sel = v => {
    const t = (v === null || v === undefined) ? "" : String(v);
    return /[";\r\n,]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
  };
  return "\ufeff" + baris.map(r => r.map(sel).join(pemisah)).join("\r\n") + "\r\n";
}

function bacaCsv(teks){
  if (teks.charCodeAt(0) === 0xFEFF) teks = teks.slice(1);
  teks = teks.replace(/^sep=.\r?\n/i, "");
  const barisPertama = teks.split(/\r?\n/, 1)[0];
  let pemisah = ";", terbanyak = -1;
  for (const kandidat of [";", ",", "\t"]) {
    let jumlah = 0, kutip = false;
    for (const c of barisPertama) {
      if (c === '"') kutip = !kutip;
      else if (c === kandidat && !kutip) jumlah++;
    }
    if (jumlah > terbanyak) { terbanyak = jumlah; pemisah = kandidat; }
  }
  const hasil = [];
  let baris = [], isi = "", kutip = false;
  for (let i = 0; i < teks.length; i++) {
    const c = teks[i];
    if (kutip) {
      if (c === '"') {
        if (teks[i + 1] === '"') { isi += '"'; i++; }
        else kutip = false;
      } else isi += c;
    } else if (c === '"' && isi === "") kutip = true;
    else if (c === pemisah) { baris.push(isi); isi = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && teks[i + 1] === "\n") i++;
      baris.push(isi); hasil.push(baris); baris = []; isi = "";
    } else isi += c;
  }
  if (isi !== "" || baris.length) { baris.push(isi); hasil.push(baris); }
  return hasil;
}

/* =====================================================
   XLSX (tanpa pustaka luar)
   ===================================================== */
const TABEL_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function hitungCrc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = TABEL_CRC[(c ^ bytes[i]) & 255] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buatZip(berkas){
  const enc = new TextEncoder();
  const bagian = [], pusat = [];
  let offset = 0, ukuranPusat = 0;
  for (const f of berkas) {
    const nama = enc.encode(f.nama);
    const crc = hitungCrc32(f.data);
    const ukuran = f.data.length;
    const lokal = new DataView(new ArrayBuffer(30));
    lokal.setUint32(0, 0x04034b50, true); lokal.setUint16(4, 20, true); lokal.setUint16(6, 0x0800, true);
    lokal.setUint16(8, 0, true); lokal.setUint16(10, 0, true); lokal.setUint16(12, 33, true);
    lokal.setUint32(14, crc, true); lokal.setUint32(18, ukuran, true); lokal.setUint32(22, ukuran, true);
    lokal.setUint16(26, nama.length, true); lokal.setUint16(28, 0, true);
    bagian.push(new Uint8Array(lokal.buffer), nama, f.data);
    const entri = new DataView(new ArrayBuffer(46));
    entri.setUint32(0, 0x02014b50, true); entri.setUint16(4, 20, true); entri.setUint16(6, 20, true);
    entri.setUint16(8, 0x0800, true); entri.setUint16(10, 0, true); entri.setUint16(12, 0, true);
    entri.setUint16(14, 33, true); entri.setUint32(16, crc, true); entri.setUint32(20, ukuran, true);
    entri.setUint32(24, ukuran, true); entri.setUint16(28, nama.length, true);
    entri.setUint32(42, offset, true);
    pusat.push(new Uint8Array(entri.buffer), nama);
    offset += 30 + nama.length + ukuran;
    ukuranPusat += 46 + nama.length;
  }
  const akhir = new DataView(new ArrayBuffer(22));
  akhir.setUint32(0, 0x06054b50, true);
  akhir.setUint16(8, berkas.length, true); akhir.setUint16(10, berkas.length, true);
  akhir.setUint32(12, ukuranPusat, true); akhir.setUint32(16, offset, true);
  return new Blob([...bagian, ...pusat, new Uint8Array(akhir.buffer)],
    { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function hurufKolom(i){
  let s = "";
  for (i++; i > 0; i = Math.floor((i - 1) / 26)) s = String.fromCharCode(65 + (i - 1) % 26) + s;
  return s;
}

function escapeXml(t){
  return String(t).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function buatBerkasXlsx(baris){
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  const enc = new TextEncoder();
  const xml = t => enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' + t);
  const gayaKolom = KOLOM_DATA.map(k => k.rupiah ? 2 : 0);
  const sel = (v, r, c, gaya) => {
    const ref = hurufKolom(c) + r;
    const s = gaya ? ` s="${gaya}"` : "";
    if (typeof v === "number" && Number.isFinite(v)) return `<c r="${ref}"${s}><v>${v}</v></c>`;
    const t = (v === null || v === undefined) ? "" : String(v);
    if (t === "") return "";
    return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${escapeXml(t)}</t></is></c>`;
  };
  const isiBaris = baris.map((r, i) => {
    const nomor = i + 1;
    const sels = r.map((v, c) => sel(v, nomor, c, i === 0 ? 1 : gayaKolom[c])).join("");
    return `<row r="${nomor}">${sels}</row>`;
  }).join("");
  const lebar = KOLOM_DATA.map((k, i) => `<col min="${i + 1}" max="${i + 1}" width="${k.lebar}" customWidth="1"/>`).join("");
  const lembar = `<worksheet ${NS}><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${lebar}</cols><sheetData>${isiBaris}</sheetData></worksheet>`;
  const gaya = `<styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`;
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  return buatZip([
    { nama: "[Content_Types].xml", data: xml(`<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>`) },
    { nama: "_rels/.rels", data: xml(`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="xl/workbook.xml"/></Relationships>`) },
    { nama: "xl/workbook.xml", data: xml(`<workbook ${NS} xmlns:r="${REL}"><sheets><sheet name="Produk" sheetId="1" r:id="rId1"/></sheets></workbook>`) },
    { nama: "xl/_rels/workbook.xml.rels", data: xml(`<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${REL}/styles" Target="styles.xml"/></Relationships>`) },
    { nama: "xl/styles.xml", data: xml(gaya) },
    { nama: "xl/worksheets/sheet1.xml", data: xml(lembar) }
  ]);
}

async function bacaZip(buffer){
  const u = new Uint8Array(buffer);
  const dv = new DataView(buffer);
  let e = -1;
  for (let i = u.length - 22; i >= Math.max(0, u.length - 65557); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { e = i; break; }
  }
  if (e < 0) throw new Error("BUKAN_ZIP");
  const jumlah = dv.getUint16(e + 10, true);
  let p = dv.getUint32(e + 16, true);
  const dec = new TextDecoder();
  const daftar = {};
  for (let i = 0; i < jumlah; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) throw new Error("BUKAN_ZIP");
    const nlen = dv.getUint16(p + 28, true), elen = dv.getUint16(p + 30, true), clen = dv.getUint16(p + 32, true);
    daftar[dec.decode(u.subarray(p + 46, p + 46 + nlen))] = {
      metode: dv.getUint16(p + 10, true), ukuran: dv.getUint32(p + 20, true), offset: dv.getUint32(p + 42, true)
    };
    p += 46 + nlen + elen + clen;
  }
  return {
    ada: nama => nama in daftar,
    async teks(nama){
      const f = daftar[nama];
      if (!f) return null;
      const start = f.offset + 30 + dv.getUint16(f.offset + 26, true) + dv.getUint16(f.offset + 28, true);
      const data = u.subarray(start, start + f.ukuran);
      if (f.metode === 0) return dec.decode(data);
      if (f.metode !== 8) throw new Error("ZIP_TIDAK_DIDUKUNG");
      if (typeof DecompressionStream === "undefined") throw new Error("TANPA_DEKOMPRESI");
      const aliran = new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
      return dec.decode(await new Response(aliran).arrayBuffer());
    }
  };
}

function bukaEntitasXml(t){
  return t.replace(/&(#x[0-9a-f]+|#\d+|lt|gt|amp|quot|apos);/gi, (m, k) => {
    k = k.toLowerCase();
    if (k === "lt") return "<";
    if (k === "gt") return ">";
    if (k === "amp") return "&";
    if (k === "quot") return '"';
    if (k === "apos") return "'";
    const kode = k[1] === "x" ? parseInt(k.slice(2), 16) : parseInt(k.slice(1), 10);
    return String.fromCodePoint(kode);
  });
}

function kumpulkanTeksXml(blok){
  blok = blok.replace(/<(?:\w+:)?rPh\b[\s\S]*?<\/(?:\w+:)?rPh>/g, "");
  let hasil = "";
  blok.replace(/<(?:\w+:)?t\b[^>]*?(?:\/>|>([\s\S]*?)<\/(?:\w+:)?t>)/g, (m, isi) => { hasil += isi || ""; return m; });
  return bukaEntitasXml(hasil);
}

async function bacaXlsx(buffer){
  const zip = await bacaZip(buffer);
  let jalurLembar = "xl/worksheets/sheet1.xml";
  const buku = await zip.teks("xl/workbook.xml");
  const relasi = await zip.teks("xl/_rels/workbook.xml.rels");
  if (buku && relasi) {
    const idLembar = (buku.match(/<(?:\w+:)?sheet\b[^>]*?\br:id="([^"]+)"/) || [])[1];
    if (idLembar) {
      for (const tag of relasi.match(/<Relationship\b[^>]*>/g) || []) {
        if ((tag.match(/\bId="([^"]+)"/) || [])[1] === idLembar) {
          const target = (tag.match(/\bTarget="([^"]+)"/) || [])[1];
          if (target) jalurLembar = target.startsWith("/") ? target.slice(1) : "xl/" + target;
        }
      }
    }
  }
  const xmlLembar = await zip.teks(jalurLembar);
  if (!xmlLembar) throw new Error("LEMBAR_KOSONG");
  const bersama = [];
  if (zip.ada("xl/sharedStrings.xml")) {
    const xmlBersama = await zip.teks("xl/sharedStrings.xml");
    for (const m of xmlBersama.matchAll(/<(?:\w+:)?si\b[^>]*>([\s\S]*?)<\/(?:\w+:)?si>/g)) bersama.push(kumpulkanTeksXml(m[1]));
  }
  const peta = new Map();
  for (const m of xmlLembar.matchAll(/<(?:\w+:)?c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/(?:\w+:)?c>)/g)) {
    const atribut = m[1], isi = m[2] || "";
    const ref = (atribut.match(/\br="([A-Z]+)(\d+)"/) || []);
    if (!ref[1]) continue;
    const tipe = (atribut.match(/\bt="([^"]+)"/) || [])[1] || "n";
    const v = (isi.match(/<(?:\w+:)?v\b[^>]*>([\s\S]*?)<\/(?:\w+:)?v>/) || [])[1];
    let nilai;
    if (tipe === "inlineStr") nilai = kumpulkanTeksXml(isi);
    else if (v === undefined) continue;
    else if (tipe === "s") nilai = bersama[Number(v)] ?? "";
    else if (tipe === "str" || tipe === "e") nilai = bukaEntitasXml(v);
    else if (tipe === "b") nilai = v === "1" ? "TRUE" : "FALSE";
    else nilai = Number.isFinite(Number(v)) ? Number(v) : bukaEntitasXml(v);
    let kolom = 0;
    for (const huruf of ref[1]) kolom = kolom * 26 + (huruf.charCodeAt(0) - 64);
    const nomorBaris = Number(ref[2]);
    if (!peta.has(nomorBaris)) peta.set(nomorBaris, []);
    peta.get(nomorBaris)[kolom - 1] = nilai;
  }
  const hasil = [];
  const nomor = [...peta.keys()].sort((a, b) => a - b);
  for (const n of nomor) {
    while (hasil.length < n - 1) hasil.push([]);
    const baris = peta.get(n);
    hasil.push(Array.from(baris, v => v === undefined ? "" : v));
  }
  return hasil;
}

/* =====================================================
   DATA PRODUK <-> BARIS TABEL
   ===================================================== */
function produkKeBaris(daftar){
  const judul = KOLOM_DATA.map(k => k.judul);
  const isi = daftar.map(p => KOLOM_DATA.map(k => {
    const v = p[k.kunci];
    if (k.angka) return Number.isFinite(Number(v)) && v !== null && v !== "" ? Number(v) : "";
    return v === null || v === undefined ? "" : v;
  }));
  return [judul, ...isi];
}

function barisKeProduk(baris){
  let indeksJudul = -1, petaKolom = null;
  for (let i = 0; i < Math.min(baris.length, 10); i++) {
    const kandidat = {};
    baris[i].forEach((sel, c) => {
      const nama = normalisasiJudul(sel);
      const kolom = KOLOM_DATA.find(k => k.alias.includes(nama));
      if (kolom && !(kolom.kunci in kandidat)) kandidat[kolom.kunci] = c;
    });
    if (Object.keys(kandidat).length >= 2 && "model" in kandidat) { indeksJudul = i; petaKolom = kandidat; break; }
  }
  if (!petaKolom) return { galat: "Judul kolom tidak dikenali. Pastikan ada kolom Model. Pakai template atau file hasil ekspor." };
  const teks = v => (v === null || v === undefined) ? "" : String(v).trim();
  const ambil = (r, kunci) => kunci in petaKolom ? r[petaKolom[kunci]] : "";
  const produk = [];
  let dilewati = 0;
  for (const r of baris.slice(indeksJudul + 1)) {
    if (!r.some(sel => teks(sel) !== "")) continue;
    const model = teks(ambil(r, "model"));
    if (!model) { dilewati++; continue; }
    const angka = (kunci, titik) => parseAngka(ambil(r, kunci), titik);
    let hargaList = angka("harga_list");
    if (!Number.isFinite(hargaList) || hargaList < 0) hargaList = 0;
    let diskon = angka("diskon_persen", true);
    let hargaDiskon = angka("harga_diskon");
    if (!Number.isFinite(hargaDiskon) || hargaDiskon < 0) hargaDiskon = NaN;
    if (!Number.isFinite(diskon)) {
      diskon = (Number.isFinite(hargaDiskon) && hargaList > 0) ? Math.round((1 - hargaDiskon / hargaList) * 100 * 100) / 100 : 0;
    }
    diskon = Math.min(100, Math.max(0, diskon));
    if (!Number.isFinite(hargaDiskon)) hargaDiskon = Math.round(hargaList * (1 - diskon / 100));
    const stok = kunci => { const n = angka(kunci); return Number.isFinite(n) ? Math.max(0, Math.round(n)) : 0; };
    const lain = kunci => teks(ambil(r, kunci)) || "-";
    produk.push({
      id: 0,
      kode_katalog: teks(ambil(r, "kode_katalog")),
      kategori: teks(ambil(r, "kategori")),
      model,
      warna: teks(ambil(r, "warna")),
      harga_list: hargaList,
      diskon_persen: diskon,
      harga_diskon: hargaDiskon,
      deskripsi: lain("deskripsi"),
      keterangan: lain("keterangan"),
      dimensi: lain("dimensi"),
      jumlah_koli: lain("jumlah_koli"),
      berat_total: lain("berat_total"),
      stok_gudang: stok("stok_gudang"),
      stok_display: stok("stok_display"),
      gambar: teks(ambil(r, "gambar")) || null
    });
  }
  if (!produk.length) return { galat: "Tidak ada baris produk yang bisa dibaca. Kolom Model tidak boleh kosong." };
  return { produk, dilewati };
}

function barisContoh(){
  const contoh = ["CONTOH01", "Gitar", "Contoh Produk (hapus baris ini)", "Hitam", 1000000, 10, 900000, "-", "-", "-", "-", "-", 5, 0, ""];
  return [KOLOM_DATA.map(k => k.judul), contoh];
}

function nilaiForm(id){

}

function hitungHargaDiskon(){
  const hl = parseAngka(nilaiForm("f_harga_list")) || 0;
  const dp = parseAngka(nilaiForm("f_diskon_persen"), true) || 0;
  document.getElementById("f_harga_diskon").value = Math.round(hl * (1 - dp / 100));
}

function hitungDiskonPersen(){
  const hl = parseAngka(nilaiForm("f_harga_list")) || 0;
  const hd = parseAngka(nilaiForm("f_harga_diskon")) || 0;
  if (hl <= 0) return;
  document.getElementById("f_diskon_persen").value = Math.round((1 - hd / hl) * 100 * 100) / 100;
}

function bukaTambahProduk(){
  const medan = (id, label, tambahan = "") =>
    `<div class="field"><label for="${id}">${label}</label><input id="${id}" autocomplete="off" ${tambahan}></div>`;
  document.getElementById("modalContent").innerHTML = `
    <h3>➕ Tambah Produk</h3>
    ${medan("f_kategori", "Kategori")}
    ${medan("f_model", "Model *")}
    ${medan("f_warna", "Warna")}
    ${medan("f_kode_katalog", "Kode Katalog")}
    ${medan("f_harga_list", "Harga List *", 'inputmode="numeric" oninput="hitungHargaDiskon()"')}
    ${medan("f_diskon_persen", "Diskon (%)", 'inputmode="decimal" oninput="hitungHargaDiskon()"')}
    ${medan("f_harga_diskon", "Harga Setelah Diskon", 'inputmode="numeric" oninput="hitungDiskonPersen()"')}
    ${medan("f_deskripsi", "Deskripsi")}
    ${medan("f_keterangan", "Keterangan")}
    ${medan("f_dimensi", "Dimensi")}
    ${medan("f_jumlah_koli", "Jumlah Koli")}
    ${medan("f_berat_total", "Berat Total")}
    ${medan("f_stok_gudang", "Stok Gudang", 'inputmode="numeric"')}
    ${medan("f_stok_display", "Stok Display", 'inputmode="numeric"')}
    <div id="tambahError" class="form-error" role="alert"></div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="tutupModal()">Batal</button>
      <button class="btn" onclick="simpanProdukBaru()">Simpan</button>
    </div>`;
  document.getElementById("modalOverlay").classList.add("active");
  setTimeout(() => { const el = document.getElementById("f_kategori"); if (el) el.focus(); }, 150);
}

function simpanProdukBaru(){
  const galat = pesan => { document.getElementById("tambahError").textContent = pesan; };
  const model = nilaiForm("f_model");
  if (!model) return galat("Model wajib diisi.");
  const hargaList = parseAngka(nilaiForm("f_harga_list"));
  if (!Number.isFinite(hargaList) || hargaList < 0) return galat("Harga list wajib diisi dengan angka.");
  let diskon = 0;
  if (nilaiForm("f_diskon_persen") !== "") {
    diskon = parseAngka(nilaiForm("f_diskon_persen"), true);
    if (!Number.isFinite(diskon) || diskon < 0 || diskon > 100) return galat("Diskon harus antara 0 sampai 100.");
  }
  let hargaDiskon = Math.round(hargaList * (1 - diskon / 100));
  if (nilaiForm("f_harga_diskon") !== "") {
    hargaDiskon = parseAngka(nilaiForm("f_harga_diskon"));
    if (!Number.isFinite(hargaDiskon) || hargaDiskon < 0) return galat("Harga setelah diskon harus berupa angka.");
  }
  const stok = id => {
    if (nilaiForm(id) === "") return 0;
    const n = parseAngka(nilaiForm(id));
    return Number.isFinite(n) && n >= 0 ? Math.round(n) : NaN;
  };
  const stokGudang = stok("f_stok_gudang"), stokDisplay = stok("f_stok_display");
  if (Number.isNaN(stokGudang) || Number.isNaN(stokDisplay)) return galat("Stok harus berupa angka 0 atau lebih.");
  const lain = id => nilaiForm(id) || "-";
  const idBaru = PRODUK.reduce((m, p) => Math.max(m, Number(p.id) || 0), 0) + 1;
  PRODUK.unshift({
    id: idBaru,
    kode_katalog: nilaiForm("f_kode_katalog"),
    kategori: nilaiForm("f_kategori"),
    model,
    warna: nilaiForm("f_warna"),
    harga_list: hargaList,
    diskon_persen: diskon,
    harga_diskon: hargaDiskon,
    deskripsi: lain("f_deskripsi"),
    keterangan: lain("f_keterangan"),
    dimensi: lain("f_dimensi"),
    jumlah_koli: lain("f_jumlah_koli"),
    berat_total: lain("f_berat_total"),
    stok_gudang: stokGudang,
    stok_display: stokDisplay,
    gambar: null
  });
  if (!simpanProdukTersimpan()) { PRODUK.shift(); return; }
  tampilkanSemuaProduk();
  tutupModal();
  showToast("Produk ditambahkan", "success");
}

function tampilkanSemuaProduk(){
  filterKategoriAktif = "";
  document.getElementById("cariProduk").value = "";
  renderProduk();
  kembalikanPosisiAtasProduk();
}

function unduhDalamFormat(format, baris, awalanNama){

async function bacaBerkasImpor(berkas){
  if (!berkas) return;
  const pesan = teks => { const el = document.getElementById("imporPesan"); if (el) el.textContent = teks; };
  pesan("Membaca file...");
  try {
    const buffer = await berkas.arrayBuffer();
    const kepala = new Uint8Array(buffer.slice(0, 2));
    let baris;
    if (kepala[0] === 0x50 && kepala[1] === 0x4B) baris = await bacaXlsx(buffer);
    else if (/\.xls$/i.test(berkas.name)) { pesan("Format .xls lama tidak didukung. Simpan sebagai .xlsx atau CSV."); return; }
    else baris = bacaCsv(new TextDecoder("utf-8").decode(buffer));
    const hasil = barisKeProduk(baris);
    if (hasil.galat) { pesan(hasil.galat); return; }
    window.__imporData = hasil.produk;
    document.getElementById("modalContent").innerHTML = `
      <h3>📥 Impor Data</h3>
      <p><b>${hasil.produk.length}</b> produk siap diimpor${hasil.dilewati ? ` (${hasil.dilewati} baris dilewati karena kolom Model kosong)` : ""}.</p>
      <div class="pilihan-aksi">
        <button class="btn btn-sec" onclick="jalankanImpor('tambah')">➕ Tambahkan ke data yang ada</button>
        <button class="btn btn-danger" onclick="jalankanImpor('ganti')">♻️ Ganti semua data (${PRODUK.length} produk lama dihapus)</button>
        <button class="btn" onclick="tutupModal()">Batal</button>
      </div>`;
  } catch (kegagalan) {
    console.error("Gagal membaca file impor:", kegagalan);
    if (kegagalan && kegagalan.message === "TANPA_DEKOMPRESI") pesan("Browser ini belum bisa membaca file Excel. Simpan file sebagai CSV lalu impor lagi.");
    else if (kegagalan && /ZIP/.test(kegagalan.message)) pesan("File Excel tidak bisa dibaca. Simpan ulang sebagai .xlsx atau CSV.");
    else pesan("File tidak bisa dibaca. Coba simpan ulang sebagai .xlsx atau CSV.");
  }
}

function jalankanImpor(mode){
  const baru = window.__imporData;
  if (!baru || !baru.length) return;
  if (mode === "ganti" && !confirm(`Semua ${PRODUK.length} produk lama akan dihapus dan diganti ${baru.length} produk dari file. Lanjutkan?`)) return;
  const cadangan = PRODUK;
  let idAwal = mode === "ganti" ? 1 : cadangan.reduce((m, p) => Math.max(m, Number(p.id) || 0), 0) + 1;
  const siap = baru.map((p, i) => ({ ...p, id: idAwal + i }));
  PRODUK = mode === "ganti" ? siap : [...cadangan, ...siap];
  if (!simpanProdukTersimpan()) { PRODUK = cadangan; return; }
  tampilkanSemuaProduk();
  tutupModal();
  showToast(`${siap.length} produk diimpor`, "success");
}

function kategoriUtamaFilter(kategori){
  const nama = String(kategori || "").toLowerCase();
  if (/accessor|accessories|string|mouthpiece|maintenance|pedal|stand|holder|hexrack|stool/.test(nama)) return "Aksesori";
  if (/amplifier|amps|speaker|subwoofer|mixer|console|monitor|microphone|headphone|gaming|pa system|audio|studio/.test(nama)) return "Audio";
  if (/saxophone|flute|clarinet|recorder|oboe|venova|woodwind|horn|tuba|euphonium|trumpet|trombone|baritone|cornet|flugelhorn|mellophone|pianica|pianika/.test(nama)) return "Alat Tiup";
  if (/electric guitar|guitar|gitar/.test(nama)) return "Gitar";
  if (/electric bass|bass guitar|^bass$/.test(nama)) return "Bass";
  if (/marimba|xylophone|glockenspiel|percussion|perkusi/.test(nama)) return "Perkusi";
  if (/drum|timpani|snare|cymbal|finger drum|dtx/.test(nama)) return "Drum";
  if (/piano|grand|transacoustic|disklavier|dgx|premium/.test(nama)) return "Piano";
  if (/keyboard|synth|workstation|electone|sonogenic|psr|pss|genos|harmony director/.test(nama)) return "Keyboard & Synth";
  return "Aksesori";
}

function normalisasiKataCari(teks){
  return String(teks ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "");
}

function perbaruiPosisiBilahCari(){
  jadwalPosisiKeyboard = false;
  const viewport = window.visualViewport;
  document.documentElement.style.setProperty("--visual-viewport-top", `${viewport?.offsetTop || 0}px`);
  document.documentElement.style.setProperty("--visual-viewport-height", `${viewport?.height || window.innerHeight}px`);
  if (!pencarianAktif || !window.matchMedia("(max-width: 760px)").matches || !window.visualViewport) {
    offsetKeyboardCari = 0;
    bilahCariProduk.style.removeProperty("--keyboard-offset");
    return;
  }

  const batasBawahVisual = viewport.offsetTop + viewport.height;
  const batasBawahBilah = bilahCariProduk.getBoundingClientRect().bottom;
  offsetKeyboardCari = Math.max(0, batasBawahBilah + offsetKeyboardCari - batasBawahVisual);
  bilahCariProduk.style.setProperty("--keyboard-offset", `${offsetKeyboardCari}px`);
}

function jadwalkanPembaruanPosisiBilahCari(){

function mulaiEditField(event, id, field, fokusLangsung = false){
  const diKelompokTerbuka = document.getElementById("screen-detail-kelompok").classList.contains("active");
  if (!diKelompokTerbuka && !["diskon", "diskon_rupiah", "harga_diskon"].includes(field)) return;
  const p = PRODUK.find(x => x.id === id);
  const targetEl = event.currentTarget;
  if (!p || !targetEl) return;

  let nilai = p[field] ?? "";
  if (field === "diskon") {
    nilai = p.diskon_persen ?? 0;
  } else if (field === "diskon_rupiah") {
    nilai = Math.max(0, Number(p.harga_list) - Number(p.harga_diskon ?? p.harga_list));
  } else if (field === "stok_total") {
    nilai = (Number(p.stok_gudang) || 0) + (Number(p.stok_display) || 0);
  }

  const multiline = field === "deskripsi" || field === "keterangan";
  const numeric = ["harga_list", "diskon", "diskon_rupiah", "harga_diskon", "stok_gudang", "stok_display", "stok_total"].includes(field);
  const editor = document.createElement("span");
  editor.className = "field-editor";
  editor.dataset.multiline = String(multiline);
  editor.dataset.detailAutoSave = String(!diKelompokTerbuka);
  const input = document.createElement(multiline ? "textarea" : "input");
  input.className = "edit-inline";
  input.dataset.id = String(id);
  input.dataset.field = field;
  input.value = String(nilai);
  input.addEventListener("click", event => event.stopPropagation());
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && (!multiline || !event.shiftKey)) {
      event.preventDefault();
      simpanEditInline(input);
    } else if (event.key === "Escape") {
      batalkanEditInline(input);
    }
  });
  if (!multiline) {
    input.type = numeric ? "tel" : "text";
    if (numeric) input.inputMode = field === "diskon" ? "decimal" : "numeric";
  }
  editor.appendChild(input);

  if (diKelompokTerbuka) {
    const actions = document.createElement("span");
    actions.className = "field-editor-actions";
    [
      ["Simpan", "btn btn-sec", () => simpanEditInline(input)],
      ["Batal", "btn", () => batalkanEditInline(input)],
      ["Hapus", "btn btn-danger", () => hapusNilaiEditInline(input)]
    ].forEach(([label, className, action]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = className;
      button.textContent = label;
      button.addEventListener("click", event => {
        event.stopPropagation();
        action();
      });
      actions.appendChild(button);
    });
    editor.appendChild(actions);
  } else {
    editorDetailAktif = { editor, input, original: targetEl.cloneNode(true) };
  }
  targetEl.replaceWith(editor);

  const container = document.getElementById("screen-detail-kelompok").classList.contains("active")
    ? document.getElementById("isiKelompokDetail")
    : document.getElementById("detailContent");
  const fokusInput = () => {
    const activeInput = container.querySelector(`.edit-inline[data-id="${id}"][data-field="${field}"]`);
    if (activeInput) { activeInput.focus(); activeInput.select(); }
  };
  if (fokusLangsung) fokusInput();
  else setTimeout(fokusInput, 50);
}

document.addEventListener("pointerdown", event => {
  if (!editorDetailAktif || !document.getElementById("screen-detail").classList.contains("active")) return;
  if (editorDetailAktif.editor.contains(event.target)) return;
  const targetEditable = event.target.closest('[data-edit-field="diskon"], [data-edit-field="diskon_rupiah"], [data-edit-field="harga_diskon"]');
  if (targetEditable) {

    const id = Number(editorDetailAktif.input.dataset.id);

    return;
  }

}, true);

async function simpanEditInline(inputEl, sudahDiotorisasi = false){
  const id = Number(inputEl.getAttribute("data-id"));
  const field = inputEl.getAttribute("data-field");
  const p = PRODUK.find(x => x.id === id);
  if (!p) return;

  const nilaiTeks = inputEl.value.trim();
  const numericFields = ["harga_list", "diskon", "diskon_rupiah", "harga_diskon", "stok_gudang", "stok_display", "stok_total"];
  const nilaiBaru = Number(nilaiTeks);
  if (numericFields.includes(field) && (!nilaiTeks || !Number.isFinite(nilaiBaru))) {
    showToast("Masukkan angka yang valid", "error");
    return;
  }

  const kebutuhanPIN = kebijakanPINUntukField(field);
  if (kebutuhanPIN && !sudahDiotorisasi) {
    const pesan = kebutuhanPIN === "login"
      ? "Masukkan PIN untuk mengubah nama atau model produk."
      : "Masukkan PIN untuk mengubah stok.";
    mintaPIN(pesan, () => simpanEditInline(inputEl, true));
    return;
  }

  if (field === "harga_list") {
    if (nilaiBaru <= 0) {
      showToast("Harga list harus lebih dari 0", "error");
      return;
    }
    p.harga_list = nilaiBaru;
    p.harga_diskon = Math.round(nilaiBaru * (1 - (Number(p.diskon_persen) || 0) / 100));
  } else if (field === "diskon") {
    if (nilaiBaru < 0 || nilaiBaru > 100) {
      showToast("Diskon harus 0-100%", "error");
      return;
    }
    p.diskon_persen = nilaiBaru;
    p.harga_diskon = Math.round(p.harga_list * (1 - nilaiBaru / 100));
  } else if (field === "diskon_rupiah") {
    if (nilaiBaru < 0 || nilaiBaru > p.harga_list) {
      showToast("Nilai diskon rupiah tidak valid", "error");
      return;
    }
    p.harga_diskon = p.harga_list - nilaiBaru;
    p.diskon_persen = p.harga_list > 0 ? Math.round((nilaiBaru / p.harga_list) * 10000) / 100 : 0;
  } else if (field === "harga_diskon") {
    if (nilaiBaru <= 0 || nilaiBaru > p.harga_list) {
      showToast("Harga setelah diskon tidak valid", "error");
      return;
    }
    p.harga_diskon = nilaiBaru;
    p.diskon_persen = Math.round((1 - nilaiBaru / p.harga_list) * 10000) / 100;
  } else if (field === "stok_gudang" || field === "stok_display") {
    if (!Number.isInteger(nilaiBaru) || nilaiBaru < 0) {
      showToast("Stok harus berupa bilangan bulat minimal 0", "error");
      return;
    }
    p[field] = nilaiBaru;
  } else if (field === "stok_total") {
    const stokDisplay = Number(p.stok_display) || 0;
    if (!Number.isInteger(nilaiBaru) || nilaiBaru < stokDisplay) {
      showToast("Total stok tidak boleh lebih kecil dari stok display", "error");
      return;
    }
    p.stok_gudang = nilaiBaru - stokDisplay;
  } else {
    p[field] = nilaiTeks;
  }

  if (editorDetailAktif?.input === inputEl) editorDetailAktif = null;
  if (simpanProdukTersimpan()) showToast("Tersimpan", "success");
  renderTampilanProdukAktif(id);
}

function batalkanEditInline(inputEl){
  if (editorDetailAktif?.input === inputEl) editorDetailAktif = null;
  renderTampilanProdukAktif(Number(inputEl.dataset.id));
}

function hapusNilaiEditInline(inputEl, sudahDiotorisasi = false){
  const id = Number(inputEl.dataset.id);
  const field = inputEl.dataset.field;
  const p = PRODUK.find(x => x.id === id);
  if (!p) return;
  const kebutuhanPIN = kebijakanPINUntukField(field);
  if (kebutuhanPIN && !sudahDiotorisasi) {
    const pesan = kebutuhanPIN === "login"
      ? "Masukkan PIN untuk mengosongkan nama atau model produk."
      : "Masukkan PIN untuk mengosongkan stok.";
    mintaPIN(pesan, () => hapusNilaiEditInline(inputEl, true));
    return;
  }
  if (!confirm("Kosongkan nilai pada isian ini?")) return;

  if (field === "diskon" || field === "diskon_rupiah") {
    p.diskon_persen = 0;
    p.harga_diskon = Number(p.harga_list) || 0;
  } else if (field === "harga_diskon") {
    p.harga_diskon = Number(p.harga_list) || 0;
    p.diskon_persen = 0;
  } else if (field === "harga_list") {
    p.harga_list = 0;
    p.harga_diskon = 0;
    p.diskon_persen = 0;
  } else if (field === "stok_gudang" || field === "stok_display") {
    p[field] = 0;
  } else if (field === "stok_total") {
    p.stok_gudang = 0;
    p.stok_display = 0;
  } else {
    p[field] = "";
  }

  if (simpanProdukTersimpan()) showToast("Isian dikosongkan", "success");
  renderTampilanProdukAktif(id);
}

function renderProduk(){
  const grid = document.getElementById("gridProduk");
  const kataCari = document.getElementById("cariProduk").value.match(/[a-z0-9]+/gi) || [];
  let hasil = PRODUK;
  if (kataCari.length) {
    const bidangPrioritas = ["model", "kategori", "warna", "deskripsi", "keterangan"];
    const awalanCari = normalisasiKataCari(kataCari[0]);
    hasil = hasil
      .map((produk, urutanAwal) => {
        const nilaiBidang = bidangPrioritas.map(bidang => normalisasiKataCari(produk[bidang]));
        const teksProduk = normalisasiKataCari([
          produk.id, produk.kode_katalog, ...bidangPrioritas.map(bidang => produk[bidang])
        ].join(" "));
        const cocok = kataCari.every(kata => teksProduk.includes(normalisasiKataCari(kata)));
        const peringkat = nilaiBidang.findIndex(nilai => awalanCari && nilai.startsWith(awalanCari));
        return { produk, urutanAwal, cocok, peringkat: peringkat < 0 ? bidangPrioritas.length : peringkat };
      })
      .filter(item => item.cocok)
      .sort((a, b) => a.peringkat - b.peringkat || a.urutanAwal - b.urutanAwal)
      .map(item => item.produk);
  }
  if (filterKategoriAktif) {
    hasil = hasil.filter(p => kategoriUtamaFilter(p.kategori) === filterKategoriAktif);
  }
  if (hasil.length === 0) {
    grid.innerHTML = '<div class="empty" style="grid-column:1/-1">Produk tidak ditemukan</div>';
    return;
  }
  grid.innerHTML = hasil.map(p => {
    const totalStok = (Number(p.stok_gudang) || 0) + (Number(p.stok_display) || 0);
    const terpilih = produkTerpilih.includes(p.id);
    const chk = modePilihAktif ? `<div class="chk-pilih">${terpilih?"✓":""}</div>` : "";
    const cls = "kartu-produk" + (terpilih?" terpilih":"");
    return `<div class="${cls}" data-id="${p.id}" ${modePilihAktif
  ? `onclick="togglePilih(${p.id})"`
  : `ontouchstart="mulaiTahan(event,${p.id})" ontouchend="akhirTahan(${p.id},'touch')" ontouchcancel="batalTahan()" ontouchmove="cekGerakan(event)" onmousedown="mulaiTahan(event,${p.id})" onmouseup="akhirTahan(${p.id},'mouse')" onmouseleave="batalTahan()"`}>
      ${chk}
      <div class="body">
        <div class="kategori-produk">${p.kategori}</div>
        <div class="nama-rapat model-produk">${p.model}</div>
        <div class="warna">${p.warna||"-"}</div>
        <div class="harga-list"><span class="harga-list-nominal">${rupiah(p.harga_list)}</span> <span class="diskon">(-${p.diskon_persen||0}%)</span></div>
        <div class="harga-diskon">${rupiah(p.harga_diskon??p.harga_list)}</div>
        <div class="stok-ket">Stok: ${totalStok}</div>
        <div class="keterangan-ket">Ket: ${p.keterangan||"-"}</div>
      </div>
    </div>`;
  }).join("");
}

/* =====================================================
   FITUR HAPUS - DETEKSI TAHAN 3 DETIK
   ===================================================== */
let tahanTimer = null;
let tahanTerjadi = false;
let posisiAwalX = 0;
let posisiAwalY = 0;
let jariBergerak = false;
let sumberSentuhan = "mouse";
let abaikanMouseSampai = 0;


function mulaiTahan(e, id){
  sumberSentuhan = e.type.startsWith("touch") ? "touch" : "mouse";
  if (sumberSentuhan === "mouse" && Date.now() < abaikanMouseSampai) return;
  tahanTerjadi = false;
  jariBergerak = false;
  clearTimeout(tahanTimer);
  
  const sentuh = e.touches ? e.touches[0] : e;
  posisiAwalX = sentuh.clientX;
  posisiAwalY = sentuh.clientY;
  
  tahanTimer = setTimeout(() => {
    if (!jariBergerak) {
      tahanTerjadi = true;
      tampilDialogHapus(id);
    }
  }, 1500);
}


function batalTahan(){
  clearTimeout(tahanTimer);
  jariBergerak = true;
}


function akhirTahan(id, sumber = sumberSentuhan){
  if (sumber === "mouse" && Date.now() < abaikanMouseSampai) return;
  if (sumber === "touch") abaikanMouseSampai = Date.now() + 700;
  clearTimeout(tahanTimer);
  if (jariBergerak) {
    tahanTerjadi = false;
    jariBergerak = false;
    return;
  }
  if (!tahanTerjadi) {
    ketukDuaKali(`produk-${id}`, () => bukaDetail(id));
  }
  tahanTerjadi = false;
}
  function cekGerakan(e){
  const sentuh = e.touches ? e.touches[0] : e;
  const dx = Math.abs(sentuh.clientX - posisiAwalX);
  const dy = Math.abs(sentuh.clientY - posisiAwalY);
  if (dx > 10 || dy > 10) {
    jariBergerak = true;
    clearTimeout(tahanTimer);
  }
  }




/* =====================================================
   DIALOG PILIHAN HAPUS
   ===================================================== */
let idProdukHapus = null;


function tampilDialogHapus(id){
  idProdukHapus = id;
  const p = PRODUK.find(x => x.id === id);
  document.getElementById("modalContent").classList.add("filter-modal");
  document.getElementById("modalContent").innerHTML = `
    <h3>🗑️ Hapus Produk</h3>
    <p>${p.kategori} ${p.model}</p>
    <div class="pilihan-aksi">
      <button class="btn btn-danger" onclick="pilihHapusSatu()"><span class="ico">1️⃣</span> Hapus yang dipilih</button>
      <button class="btn btn-danger" onclick="pilihHapusSebagian()"><span class="ico">2️⃣</span> Hapus sebagian</button>
      <button class="btn btn-danger" onclick="pilihHapusSemua()"><span class="ico">3️⃣</span> Hapus seluruhnya</button>
      <button class="btn btn-sec" onclick="tutupModal()">Batal</button>
    </div>`;
  const modalOverlay = document.getElementById("modalOverlay");
  modalOverlay.classList.toggle("filter-keyboard-open",
    document.activeElement === inputCariProduk
    && window.matchMedia("(max-width: 760px)").matches);
  modalOverlay.classList.add("active");
}


/* =====================================================
   AKSI 1 — HAPUS YANG DIPILIH (1 PRODUK)
   ===================================================== */
function pilihHapusSatu(){
  PRODUK = PRODUK.filter(x => x.id !== idProdukHapus);
  if (simpanProdukTersimpan()) showToast("Produk dihapus", "success");
  renderProduk();
  tutupModal();
}


/* =====================================================
   AKSI 2 — HAPUS SEBAGIAN (MODE PILIH)
   ===================================================== */
function pilihHapusSebagian(){
  tutupModal();
  modePilihAktif = true;
  produkTerpilih = [];
  renderProduk();
  updateTombolHapus();
  showToast("Pilih produk yang mau dihapus", "success");
}


function togglePilih(id){
  const idx = produkTerpilih.indexOf(id);
  if (idx >= 0) produkTerpilih.splice(idx, 1);
  else produkTerpilih.push(id);
  renderProduk();
  updateTombolHapus();
}


function updateTombolHapus(){
  sinkronRiwayat();
  const btn = document.getElementById("tombolHapusTerpilih");
  document.getElementById("tombolKembaliProduk").style.display = modePilihAktif ? "" : "none";
  if (modePilihAktif && produkTerpilih.length > 0) {
    btn.textContent = `🗑️ Hapus (${produkTerpilih.length})`;
    btn.classList.add("show");
  } else {
    btn.classList.remove("show");
  }
}


function aksiHapusSebagian(){
  if (produkTerpilih.length === 0) return;
  PRODUK = PRODUK.filter(x => !produkTerpilih.includes(x.id));
  const jumlahDihapus = produkTerpilih.length;
  const berhasilDisimpan = simpanProdukTersimpan();
  if (berhasilDisimpan) showToast(`${jumlahDihapus} produk dihapus`, "success");
  modePilihAktif = false;
  produkTerpilih = [];
  renderProduk();
  updateTombolHapus();
  tutupModal();
}


function keluarModePilih(){
  if (modePilihAktif) {
    modePilihAktif = false;
    produkTerpilih = [];
    renderProduk();
    updateTombolHapus();
  }
}


/* =====================================================
   AKSI 3 — HAPUS SELURUHNYA
   ===================================================== */
function pilihHapusSemua(){
  tutupModal();
  setTimeout(() => {
    document.getElementById("modalContent").innerHTML = `
      <h3>⚠️ Hapus SEMUA Produk?</h3>
      <p>Semua ${PRODUK.length} produk akan dihapus permanen. Tindakan ini tidak bisa dibatalkan.</p>
      <div class="btn-row">
        <button class="btn btn-sec" onclick="tutupModal()">Batal</button>
        <button class="btn btn-danger" onclick="konfirmasiHapusSemua()">Ya, Hapus Semua</button>
      </div>`;
    document.getElementById("modalOverlay").classList.add("active");
  }, 200);
}


function konfirmasiHapusSemua(){
  PRODUK = [];
  if (simpanProdukTersimpan()) showToast("Semua produk dihapus", "success");
  renderProduk();
  tutupModal();
}


/* =====================================================
   INPUT PIN
   ===================================================== */
function mintaPIN(pesan, onBerhasil){
  document.getElementById("modalContent").innerHTML = `
    <h3>🔐 Masukkan PIN</h3>
    <p>${pesan}</p>
    <div class="field">
      <input type="password" id="inputPIN" class="pin-input" maxlength="4" inputmode="numeric" autocomplete="off" placeholder="••••" onkeydown="if(event.key==='Enter')verifikasiPIN()">
    </div>
    <div id="pinError" style="color:#e63946;font-size:12px;text-align:center;min-height:18px;margin-bottom:8px"></div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="tutupModal()">Batal</button>
      <button class="btn btn-danger" onclick="verifikasiPIN()">Konfirmasi</button>
    </div>`;
  document.getElementById("modalOverlay").classList.add("active");
  window.__pinRequest = { onBerhasil };
  setTimeout(() => {
    const inp = document.getElementById("inputPIN");
    if (inp) inp.focus();
  }, 150);
}


function verifikasiPIN(){
  const request = window.__pinRequest;
  const input = document.getElementById("inputPIN");
  const error = document.getElementById("pinError");
  if (!request || !input || !error) return;
  if (input.value !== PIN_DEFAULT) {
    error.textContent = "PIN salah.";
    input.value = "";
    input.focus();
    return;
  }
  const aksiBerhasil = request.onBerhasil;
  tutupModal();
  aksiBerhasil();
}


function tutupModal(){
  document.getElementById("modalOverlay").classList.remove("active", "filter-keyboard-open");
  document.getElementById("modalContent").classList.remove("filter-modal");
  idProdukHapus = null;
  window.__pinRequest = null;
  window.__imporData = null;
}
/* =====================================================
   FILTER KATEGORI
   ===================================================== */
function bukaFilter(){
  const urutanKategori = ["Piano", "Keyboard & Synth", "Gitar", "Bass", "Drum", "Perkusi", "Alat Tiup", "Audio", "Aksesori"];
  const jumlahPerKategori = new Map();
  PRODUK.forEach(p => {
    const kategori = kategoriUtamaFilter(p.kategori);
    jumlahPerKategori.set(kategori, (jumlahPerKategori.get(kategori) || 0) + 1);
  });
  const kategoriList = urutanKategori.filter(kategori => jumlahPerKategori.has(kategori));
  let chips = `<div class="chip-cat ${!filterKategoriAktif?"active":""}" onclick="pilihFilter('')">Semua (${PRODUK.length})</div>`;
  chips += kategoriList.map(k => `<div class="chip-cat ${filterKategoriAktif===k?"active":""}" onclick="pilihFilter('${k}')">${k} (${jumlahPerKategori.get(k)})</div>`).join("");
  const modalOverlay = document.getElementById("modalOverlay");
  const modalContent = document.getElementById("modalContent");
  modalContent.classList.add("filter-modal");
  modalContent.innerHTML = `
    <h3>⚙️ Filter Kategori</h3>
    <div style="margin-bottom:10px">${chips}</div>
    <div class="btn-row">
      <button class="btn btn-sec" onclick="tutupModal()">Tutup</button>
    </div>`;
  perbaruiPosisiBilahCari();
  modalOverlay.classList.toggle("filter-keyboard-open",
    document.activeElement === inputCariProduk
    && window.matchMedia("(max-width: 760px)").matches
    && offsetKeyboardCari > 0);
  modalOverlay.classList.add("active");
}


function pilihFilter(kat){
  filterKategoriAktif = kat;
  tutupModal();
  renderProduk();
  showToast(kat ? "Filter: "+kat : "Filter dihapus", "success");
}


/* =====================================================
   TOMBOL BACK HP
   Satu entri riwayat selalu disiapkan di depan halaman awal, jadi tombol
   back HP bisa ditangkap oleh aplikasi:
   - ada lapisan terbuka (pop-up, mode pilih, detail): lapisan paling atas ditutup
   - di Daftar Produk: back pertama menampilkan pesan, back kedua (dalam 2 detik) keluar
   ===================================================== */
let riwayatSiap = false;
let jendelaKeluar = false;
let sudahDisentuh = false;

function modalTerbuka(){
  return document.getElementById("modalOverlay").classList.contains("active");
}

function layarAktif(id){
  return document.getElementById("screen-" + id).classList.contains("active");
}

function adaLapisanTerbuka(){
  return modalTerbuka() || modePilihAktif || layarAktif("detail-kelompok") || layarAktif("detail");
}

function tutupLapisTeratas(){
  if (modalTerbuka()) { tutupModal(); return true; }
  if (modePilihAktif) { keluarModePilih(); return true; }
  if (layarAktif("detail-kelompok")) { kembaliKeDetailProduk(); return true; }
  if (layarAktif("detail")) { bukaProduk(); return true; }
  return false;
}

function sinkronRiwayat(){
  if (riwayatSiap || !sudahDisentuh) return;
  if (jendelaKeluar && !adaLapisanTerbuka()) return;
  try {
    history.pushState({ toko: 1 }, "");
    riwayatSiap = true;
  } catch (e) {
    console.error("Riwayat tidak tersedia:", e);
  }
}

window.addEventListener("popstate", () => {
  riwayatSiap = false;
  if (tutupLapisTeratas()) { sinkronRiwayat(); return; }
  showToast("Tekan sekali lagi untuk keluar");
  jendelaKeluar = true;
  setTimeout(() => { jendelaKeluar = false; sinkronRiwayat(); }, 2000);
});

document.addEventListener("pointerdown", () => { sudahDisentuh = true; sinkronRiwayat(); }, { passive: true });

if (typeof MutationObserver !== "undefined") {
  new MutationObserver(sinkronRiwayat).observe(document.getElementById("modalOverlay"), { attributes: true, attributeFilter: ["class"] });
}
